# Scrape targets reach services via host.docker.internal at their
# host-mapped port -- works uniformly whether a service is running as a
# native `go run` process, an app-service container in this same
# docker-compose, or a K8s dev-overlay pod reached through `kubectl
# port-forward` to the same host port (see infra/README.md).
global:
  scrape_interval: 15s

# Aturan alert (Fase 11). Dipisah ke berkas sendiri supaya promtool bisa
# memeriksanya tersendiri di CI, dan supaya menambah alert tidak berarti
# menyentuh konfigurasi scrape.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: edp-services
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:28079"]
        labels: { service: api-gateway }
      - targets: ["host.docker.internal:28081"]
        labels: { service: auth-service }
      - targets: ["host.docker.internal:28082"]
        labels: { service: company-service }
      - targets: ["host.docker.internal:28083"]
        labels: { service: rbac-service }
      - targets: ["host.docker.internal:28084"]
        labels: { service: audit-service }
      - targets: ["host.docker.internal:28085"]
        labels: { service: finance-service }
      - targets: ["host.docker.internal:28086"]
        labels: { service: hr-service }
      - targets: ["host.docker.internal:28087"]
        labels: { service: sales-service }
      - targets: ["host.docker.internal:28088"]
        labels: { service: purchasing-service }
      - targets: ["host.docker.internal:28089"]
        labels: { service: warehouse-service }
      - targets: ["host.docker.internal:28090"]
        labels: { service: production-service }
      - targets: ["host.docker.internal:28091"]
        labels: { service: qc-service }
      - targets: ["host.docker.internal:28092"]
        labels: { service: asset-service }
      - targets: ["host.docker.internal:28093"]
        labels: { service: ai-bi-service }
      - targets: ["host.docker.internal:28094"]
        labels: { service: iot-service }
      - targets: ["host.docker.internal:28095"]
        labels: { service: dw-service }
      - targets: ["host.docker.internal:28096"]
        labels: { service: crm-service }
      - targets: ["host.docker.internal:28097"]
        labels: { service: ticketing-service }
      - targets: ["host.docker.internal:28098"]
        labels: { service: ecommerce-service }
      - targets: ["host.docker.internal:28099"]
        labels: { service: fleet-service }
      - targets: ["host.docker.internal:28100"]
        labels: { service: project-service }
