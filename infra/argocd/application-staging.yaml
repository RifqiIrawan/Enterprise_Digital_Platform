# ArgoCD Application untuk overlay staging (Fase 12).
# Lihat infra/argocd/README.md soal apa yang masih harus diganti sebelum ini
# dipakai terhadap cluster sungguhan.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edp-staging
  namespace: argocd
  finalizers:
    # Menghapus Application ini ikut menghapus resource yang dibuatnya.
    # Tanpa finalizer ini, menghapus Application meninggalkan seluruh Deployment
    # tetap hidup tanpa ada yang mengelolanya lagi.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RifqiIrawan/Enterprise_Digital_Platform.git
    targetRevision: master
    # ArgoCD mengenali kustomization.yaml di path ini dan me-render-nya
    # sendiri -- tidak perlu langkah build terpisah.
    path: infra/kubernetes/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: edp-staging
  syncPolicy:
    automated:
      # Staging memang untuk mengikuti master.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
