apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-service
  labels:
    app: fleet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-service
  template:
    metadata:
      labels:
        app: fleet-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8099"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: fleet-service
          image: REPLACE_ME_REGISTRY/fleet-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8099
          envFrom:
            - configMapRef:
                name: fleet-service-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8099
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8099
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-service
  labels:
    app: fleet-service
spec:
  selector:
    app: fleet-service
  ports:
    - port: 8099
      targetPort: 8099
