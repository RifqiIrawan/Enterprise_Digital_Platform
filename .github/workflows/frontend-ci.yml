name: Frontend CI

on:
  push:
    branches: [master]
    paths:
      - "frontend/web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/web/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      # Now enabled: .eslintrc.cjs finally exists (ESLint 8 style, matching
      # the eslint 8 devDependency already in package.json). The rule set is
      # deliberately small and correctness-only -- no formatting rules. It
      # already earned its place by catching a real `can is not defined`
      # ReferenceError that the build could not see, because the reference
      # lived in a column factory rendered at runtime.
      - name: Lint
        working-directory: frontend/web
        run: npm run lint

      # Vitest + Testing Library (jsdom). Needs no backend at all: apiClient
      # and CompanyContext are mocked, so this is purely the per-page
      # permission-resolution logic -- including one canary on a real page
      # (LeavePage) proving the button itself disappears when the create
      # permission is revoked.
      - name: Test
        working-directory: frontend/web
        run: npm test

      - name: Build
        working-directory: frontend/web
        run: npm run build
